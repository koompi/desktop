[package]
name = "koompi-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The shape every shell service crate presents: state over watch, errors, reconnect backoff, poll rate"

[dependencies]
tokio.workspace = true
zbus.workspace = true
thiserror.workspace = true
futures-util.workspace = true

[features]
# a socket pair standing in for a busy sender, so the backpressure tests need no bus
test-support = ["zbus/p2p"]

[dev-dependencies]
koompi-service = { workspace = true, features = ["test-support"] }
