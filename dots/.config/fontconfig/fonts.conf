<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <match target="font">
        <edit name="rgba" mode="assign">
        <const>none</const>
    </edit>
  </match>

    <!--
      Khmer fallback.

      None of the UI faces this desktop ships (Google Sans Flex, Readex Pro,
      Space Grotesk, JetBrains Mono NF) covers Khmer, so every Khmer string is
      served by fontconfig's fallback. Left alone that fallback lands on the
      ttf-khmer faces: Google Sans Flex falls to Khmer OS and Readex Pro and
      Space Grotesk fall to Khmer OS Metal Chrieng, a decorative display face.
      Those faces are also far taller than the Latin they sit beside - measured
      at 15px, a Khmer line box is 31px under Khmer OS and 34px under Metal
      Chrieng against 19px for Latin, so Khmer clips out of any container sized
      for Latin. Noto Sans Khmer is 21px at the same size.

      The first rule therefore appends Noto Sans Khmer to every concrete family
      request. It is keyed on "not a generic alias" rather than on a list of our
      own font names, so changing the fonts in Config.qml cannot silently take
      Khmer back to Khmer OS.

      The generics are handled separately and weakly. A strong binding on them
      would outrank the alias expansion in /etc/fonts/conf.d/60-latin.conf,
      which runs after this file, and Latin sans-serif and monospace text would
      start coming out of Noto Sans Khmer.

      Known gap: generic "monospace" keeps the old Khmer fallback, because a
      weak binding does not outrank the monospace alias list and a strong one
      would break Latin monospace. That affects terminals asking for
      "monospace", not the shell, which always names a concrete family.
    -->
    <match target="pattern">
        <test name="family" compare="not_eq"><string>sans-serif</string></test>
        <test name="family" compare="not_eq"><string>serif</string></test>
        <test name="family" compare="not_eq"><string>monospace</string></test>
        <edit name="family" mode="append" binding="strong">
            <string>Noto Sans Khmer</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>sans-serif</string></test>
        <edit name="family" mode="append" binding="weak">
            <string>Noto Sans Khmer</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="family"><string>serif</string></test>
        <edit name="family" mode="append" binding="weak">
            <string>Noto Serif Khmer</string>
        </edit>
    </match>
</fontconfig>
