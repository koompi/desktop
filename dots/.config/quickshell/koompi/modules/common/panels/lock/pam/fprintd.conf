#%PAM-1.0
# Fingerprint-only stack for the lock screen's second PamContext. libpam reads
# this file through pam_start_confdir(), never /etc/pam.d.
#
# pam_fprintd only succeeds on a "verify-match" from fprintd. The explicit deny
# below means a stack whose only module cannot be loaded, times out or errors
# ends in a failure of its own choosing rather than libpam's fallback.
#
# No clamshell gate here, unlike the sudo and polkit stacks that
# koompi-setup-fingerprint writes: the lock runs this stack beside the
# password field, never in front of it, and a gate that fails fast would
# re-arm the reader every 1.5 s (LockContext's fingerprintRearmTimer) for as
# long as the lid stays shut.
auth    sufficient    pam_fprintd.so
auth    required      pam_deny.so
