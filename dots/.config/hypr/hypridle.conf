$lock_cmd = pidof qs quickshell >/dev/null && hyprctl dispatch 'hl.dsp.global("quickshell:lock")' || pidof hyprlock >/dev/null || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

# No idle dim. The shell caches the backlight it last wrote and never re-reads
# it, so a second writer here left every slider and OSD serving a stale value.

# Branded idle layer before the lock (O32): black, the KOOMPI mark, a clock.
# This listener is its only switch; comment it out to turn it off. Nothing
# here writes the backlight, see the note above.
listener {
    timeout = 120 # 2mins
    on-timeout = qs -c koompi ipc call screensaver open
    on-resume = qs -c koompi ipc call screensaver close
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
