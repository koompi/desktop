# Build the KOOMPI OS live ISO with mkarchiso and publish it as a GitHub Release.
#
# Runs mkarchiso against the archiso profile at sdata/dist-arch/iso/koompi/,
# then publishes the resulting .iso (+ sha256 checksum) as a GitHub Release so
# users can download and install it directly.
#
# v1 NOTE: sdata/dist-arch/iso/koompi/pacman.conf deliberately disables the
# [koompi] repo — the v1 live ISO installs a 100% stock-Arch package set (see
# packages.x86_64), so no signed [koompi] repo is required to build it. Once the
# [koompi] repo (sdata/dist-arch/repo/) is signed + published and the live set
# starts pulling koompi-* packages, re-enable it in pacman.conf first.
name: Build & Release KOOMPI ISO

on:
  workflow_dispatch: {}

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # mkarchiso needs root + loop devices + mount, so the container must be
      # privileged. Without this, image assembly fails on loop-device setup.
      options: --privileged
    steps:
      - name: Install archiso + release tooling
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed archiso git github-cli

      - uses: actions/checkout@v4

      - name: Sanity-check the archiso profile
        run: |
          set -euo pipefail
          test -f sdata/dist-arch/iso/koompi/profiledef.sh || {
            echo "archiso profile not scaffolded (sdata/dist-arch/iso/koompi/)." >&2
            exit 1
          }

      - name: Build the ISO
        run: |
          set -euo pipefail
          # -v verbose, -w work dir, -o output dir, then the profile directory.
          mkarchiso -v \
            -w "$RUNNER_TEMP/archiso-work" \
            -o "$GITHUB_WORKSPACE/out" \
            sdata/dist-arch/iso/koompi/

      - name: Checksum the ISO
        working-directory: out
        run: sha256sum *.iso | tee SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: koompi-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          iso="$(ls -- *.iso)"
          tag="iso-${iso%.iso}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "KOOMPI OS — ${iso%.iso}" \
            --notes "Automated live/install ISO build from commit ${GITHUB_SHA}." \
            "$iso" SHA256SUMS
