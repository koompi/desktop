# Sourced by grub-mkconfig after /etc/default/grub, so these win over the stock
# values without this package having to own a file the grub package owns.
#
# Power button to the KOOMPI splash, no menu on the way. Hold Esc to get the
# menu back - that is the only route to the grub-btrfs snapshot list, which is
# the factory-reset path, so the wait is 1s rather than 0: GRUB's keystatus
# check is not reliable on every UEFI, and an unreachable rollback menu is a
# worse bug than one second of black.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
