# KOOMPI OS - SDDM configuration drop-in.
# The branded greeter under /usr/share/sddm/themes/koompi is Qt 6 QML with no
# component dependencies beyond qt6-declarative and qt6-5compat, both of which
# koompi-branding depends on. If it ever fails to render, `Current=breeze` is
# the safe stock fallback.
[Theme]
Current=koompi
