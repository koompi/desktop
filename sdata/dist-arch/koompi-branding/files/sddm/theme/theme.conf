[General]
logo=/usr/share/sddm/themes/koompi/logo.png

# Main.qml scans backgroundDir and picks one image at random per greeter start,
# so the login screen is different every boot. The lock screen draws from the
# same directory (modules/koompi/lock/LockSurface.qml), which is what makes lock
# and login read as one system.
backgroundDir=/usr/share/backgrounds/koompi

# Fallback for when backgroundDir is missing or empty; `color` is the fallback
# for when that is gone too. Both matter: the previous greeter had only the flat
# colour left once its single wallpaper path stopped existing, and a pure black
# login screen is what that looks like.
background=/usr/share/backgrounds/koompi/koompi-antlers.jpg
color=#0d0d0d
type=image

# Read by Main.qml. Enough blur that a busy photo never competes with the card,
# and enough dim that white text holds up over a bright one.
blur=1.0
dim=0.34

# What the greeter fades to once the password is accepted, and the only thing on
# screen for the seconds Hyprland spends on DRM/EGL bring-up. It has to equal
# misc:background_color in dots/.config/hypr/hyprland/colors.lua and the curtain
# colour in the shell's modules/koompi/background/Background.qml, or the handoff
# shows a seam. tests/test_login_handoff.sh fails if they drift.
transitionColor=#121318
