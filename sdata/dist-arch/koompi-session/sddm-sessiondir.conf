# KOOMPI OS offers one session. Other packages drop their own entries into
# /usr/share/wayland-sessions whether or not the desktop uses them -
# plasma-workspace does it for anything that pulls in a KDE portal, hyprland
# ships two - so the greeter reads KOOMPI's own directories rather than
# filtering theirs, which survives every upgrade.
#
# Both paths are ours: the package fills the first, sdata/install fills it too,
# and the second is left free for a hand-placed entry when someone needs to
# boot something else to debug. If a session entry is missing from both, the
# greeter offers nothing and nobody can log in.
[Wayland]
SessionDir=/usr/share/koompi/wayland-sessions,/usr/local/share/wayland-sessions

# KOOMPI is Wayland only. The directory is deliberately absent.
[X11]
SessionDir=/usr/share/koompi/xsessions
