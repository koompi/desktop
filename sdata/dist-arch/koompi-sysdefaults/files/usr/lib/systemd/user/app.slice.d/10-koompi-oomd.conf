# Make user apps the only thing systemd-oomd may kill.
#
# The user manager's app.slice is the one place where nothing the session
# depends on lives: Hyprland and the Quickshell shell run in the login
# session's scope (user.slice/user-N.slice/session-N.scope), and pipewire,
# the portals and the KOOMPI user services pin themselves to session.slice.
# Marking only app.slice as a kill candidate keeps the compositor and the
# shell structurally ineligible, whatever the pressure. Setting this on
# user@.service or on user.slice instead would put the whole session in the
# victim pool.
#
# What lands in app.slice today: user services with no Slice= of their own
# and anything started through `systemd-run --user --scope` or an app
# launcher that hands off to the user manager. Apps that Hyprland execs
# directly stay in the session scope, where oomd never looks; moving the
# launch path is what makes this drop-in bite for the browser.
#
# Swap kill is the backstop for the slower shape of the same failure, where
# swap fills before pressure spikes. It uses SwapUsedLimit (90%) and the
# pressure thresholds from /usr/lib/systemd/oomd.conf.d/10-koompi.conf.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
