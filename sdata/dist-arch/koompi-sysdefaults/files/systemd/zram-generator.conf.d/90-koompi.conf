# Swap on a compressed RAM device. zstd averages about 3:1, so even a full
# device holds roughly a third of RAM, and reclaim stays in memory instead of
# paging out to the disk. A 4 GB laptop keeps the session and loses the tab,
# not the other way round.
#
# Size and algorithm follow omarchy's 90-omarchy.conf (default/systemd/
# zram-generator.conf.d/); zram-generator's own default is min(ram / 2, 4096),
# which on a small machine is the half that spills to disk first.
#
# Vendor drop-in: an admin overrides it with the same filename under
# /etc/systemd/zram-generator.conf.d/, or a /dev/null symlink there to turn it off.
[zram0]
zram-size = ram
compression-algorithm = zstd

# Above the pri=0 a disk swapfile gets, so zram fills first.
swap-priority = 100
