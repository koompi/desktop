# The kernel's OOM killer fires only once an allocation has already failed,
# which for a desktop is far too late: the machine thrashes in reclaim until
# something dies somewhere fatal, and that something has been the compositor.
# systemd-oomd keys on PSI stall time instead, so it acts while the machine is
# still thrashing.
#
# 50% means half of a ten-second window was spent stalled on reclaim. Held
# for 20 s the desktop is already unusable, and losing one app is the cheaper
# outcome. systemd's defaults are 60% for 30 s. Which cgroups are eligible is
# set separately, in /usr/lib/systemd/user/app.slice.d/10-koompi-oomd.conf.
[OOM]
DefaultMemoryPressureDurationSec=20s
DefaultMemoryPressureLimit=50%
